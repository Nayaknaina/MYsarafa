        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isMobile = window.innerWidth < 768;
            if (isMobile && sidebar && !sidebar.classList.contains('-translate-x-full')) {
                if (!sidebar.contains(event.target) && !event.target.closest('button')) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        });

        window.addEventListener('resize', function () {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });

        // const API_BASE = 'http://localhost:5001/superadmin/api';
         const API_BASE = 'https://app.mysarafa.com/superadmin/api';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        const getBasePath = () => {
            const path = window.location.pathname;
            return path.substring(0, path.lastIndexOf('/') + 1);
        };

        // ✅ Load user info
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            const fullName = user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'Admin';
            document.getElementById('adminName').textContent = fullName;
            document.getElementById('adminInitial').textContent = (fullName || 'A')[0].toUpperCase();
        }

        // ✅ Format user for display
        function formatUserForDisplay(user) {
            const memberships = user.groupMemberships || [];
            const groupNames = memberships.map(m => m.groupName).join(', ') || 'N/A';
            const roleNames = memberships.map(m => m.roleName).join(', ') || 'N/A';

            return {
                _id: user._id,
                fullName: user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'N/A',
                f_name: user.f_name || '',
                l_name: user.l_name || '',
                email: user.email || 'N/A',
                phone: user.mobile_no || user.phone || 'N/A',
                groupNames,
                roleNames,
                status: user.user_status === 'verified' ? 'verified' : (user.user_status || 'unverified'),
                kyc_status: user.kyc_status || 'unsubmitted',
                blacklistStatus: user.blacklistStatus || false
            };
        }

        // ✅ Load members (UPDATED - with pagination)
        async function loadMembers(page = 1) {


            currentPage = page;

            const search = document.getElementById('searchInput').value;
            const role = document.getElementById('roleFilter').value;
            const status = document.getElementById('statusFilter').value;

            let url = `${API_BASE}/users?page=${currentPage}&limit=${limit}`;

            if (search) url += `&search=${search}`;
            if (role) url += `&role=${role}`;
            if (status) url += `&user_status=${status}`;
            console.log("Selected Role:", role);
            console.log("API URL:", url);

            try {
                const response = await fetch(url, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {

                    const users = data.data.users || [];
                    renderMembers(users.map(formatUserForDisplay));

                    renderPagination(
                        "pagination",
                        data.data.pagination.page,
                        data.data.pagination.totalPages,
                        loadMembers
                    );

                    document.getElementById("memberCount").textContent =
                        `${data.data.pagination.total} members`;

                }

            } catch (err) {
                console.log(err);
            }
        }

        // ✅ Search/Filter pe page reset karo
        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            loadMembers();
        });

        document.getElementById('roleFilter').addEventListener('change', () => {
            currentPage = 1;
            loadMembers();
        });

        document.getElementById('statusFilter').addEventListener('change', () => {
            currentPage = 1;
            loadMembers();
        });

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('roleFilter').value = '';
            document.getElementById('statusFilter').value = '';
            currentPage = 1;
            loadMembers();
        }

        // ✅ Render members
        function renderMembers(users) {
            const tbody = document.getElementById('membersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No members found</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map((user, index) => {
                const statusMap = {
                    'verified': 'active',
                    'unverified': 'pending_kyc'
                };
                const displayStatus = statusMap[user.status] || user.status || 'inactive';

                return `
        <tr class="table-row border-b">
            <td class="px-3 md:px-6 py-2 md:py-3 text-sm">${((Number(currentPage) || 1) - 1) * (Number(limit) || 10) + index + 1}</td>
            <td class="px-3 md:px-6 py-2 md:py-3 font-medium">${user.fullName}</td>
            <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600 hidden md:table-cell">${user.email}</td>
            <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600 hidden sm:table-cell">${user.phone}</td>
            <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600 hidden md:table-cell">${user.groupNames}</td>
            <td class="px-3 md:px-6 py-2 md:py-3">
                <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-700">
                    ${user.roleNames.replace(/_/g, ' ').toUpperCase()}
                </span>
            </td>
                        <td class="px-3 md:px-6 py-2 md:py-3">
                            <span class="px-2 py-1 text-xs rounded-full ${displayStatus === 'active' ? 'bg-green-100 text-green-700' :
                        displayStatus === 'pending_kyc' ? 'bg-yellow-100 text-yellow-700' :
                            'bg-red-100 text-red-700'
                    }">
                                ${displayStatus.replace('_', ' ').toUpperCase()}
                            </span>
                        </td>
                        <td class="px-3 md:px-6 py-2 md:py-3">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="openEditModal('${user._id}')" class="text-blue-600 hover:text-blue-800">
                                    <i class="fas fa-edit"></i>
                                </button>
                                ${user.role !== 'super_admin' ? `
                                    <button onclick="deleteMember('${user._id}')" class="text-red-600 hover:text-red-800">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                ` : `
                                    <span class="text-gray-400 text-xs">(protected)</span>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ✅ Open edit modal
        async function openEditModal(userId) {
            try {
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    const user = data.user;
                    document.getElementById('editUserId').value = user._id;
                    document.getElementById('editFName').value = user.f_name || '';
                    document.getElementById('editLName').value = user.l_name || '';
                    document.getElementById('editEmail').value = user.email || '';
                    document.getElementById('editPhone').value = user.mobile_no || '';
                    document.getElementById('editRole').value = user.role || 'user';
                    document.getElementById('editStatus').value = user.user_status || 'unverified';
                    document.getElementById('editModal').classList.remove('hidden');
                }
            } catch (error) {
                alert('❌ Error loading user data');
            }
        }

        // ✅ Update member
        async function updateMember(event) {
            event.preventDefault();
            const userId = document.getElementById('editUserId').value;
            const data = {

                l_name: document.getElementById('editLName').value,
                email: document.getElementById('editEmail').value,
                mobile_no: document.getElementById('editPhone').value,
                role: document.getElementById('editRole').value,
                user_status: document.getElementById('editStatus').value,
                kyc_status: document.getElementById('editStatus').value === 'verified' ? 'approved' : 'unsubmitted'
            };

            try {
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Member updated successfully!');
                    closeEditModal();
                    loadMembers();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ Error updating member');
            }
        }

        // ✅ Delete member
        async function deleteMember(userId) {
            if (!confirm('Are you sure you want to delete this member?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Member deleted successfully!');
                    loadMembers();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ Error deleting member');
            }
        }

        async function loadRoleFilter() {
            try {
                const response = await fetch(`${API_BASE}/roles/member-filter`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const data = await response.json();

                console.log("Roles API Response:", data);

                if (!data.success) return;

                const roleFilter = document.getElementById('roleFilter');

                roleFilter.innerHTML = `<option value="">All Roles</option>`;

                const roles = data.roles || [];

                roles.forEach(role => {
                    if (role.roleName === 'super_admin') return;

                    const option = document.createElement('option');

                    option.value = role.roleName;

                    option.textContent = role.roleName
                        .replace(/_/g, ' ')
                        .replace(/\b\w/g, char => char.toUpperCase());

                    roleFilter.appendChild(option);
                });

            } catch (error) {
                console.error('Error loading roles:', error);
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addMemberForm').reset();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = getBasePath() + 'login.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadRoleFilter();
            loadMembers();
        });
    </script>
    <script src="js/sidebar.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySarafa - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="icon" href="/assets/favicon/favicon_logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/favicon/favicon_logo.png">
    <style>
        .stat-card {
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .logout-btn:hover {
            background: #dc2626 !important;
        }

        .nav-link.active {
            background: rgba(139, 92, 246, 0.3) !important;
            border-left: 3px solid #8b5cf6;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>

<body>
    <div class="flex h-screen bg-gray-100">

        <div id="sidebar-container"></div>
        <button id="sidebarToggle" onclick="toggleSidebar()"
            class="lg:hidden fixed top-4 left-4 z-[60] bg-purple-600 text-white p-2.5 rounded-lg shadow-lg">
            <i class="fas fa-bars text-xl"></i>
        </button>

        <!-- Overlay for mobile -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50
           backdrop-blur-sm
           z-40 hidden lg:hidden" onclick="toggleSidebar()">
        </div>

        <!-- Main Content -->
        <div class="flex-1 min-w-0 overflow-auto ml-0 lg:ml-64">
            <!-- Header -->
            <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">Dashboard</h1>
                    <p class="text-sm text-gray-500 hidden md:block">Welcome back! Here's what's happening.</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-600 font-medium hidden sm:block" id="adminName">Loading...</span>
                        <div
                            class="w-10 h-10 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                            <span id="adminInitial">A</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-4 md:p-8">
                <!-- Stats Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6 mb-6 md:mb-8">
                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-blue-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs md:text-sm text-gray-500 font-medium">Total Users</p>
                                <p class="text-xl md:text-3xl font-bold text-gray-800" id="totalUsers">0</p>
                            </div>
                            <div
                                class="w-10 h-10 md:w-12 md:h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-users text-blue-500 text-sm md:text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-yellow-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs md:text-sm text-gray-500 font-medium">Pending KYC</p>
                                <p class="text-xl md:text-3xl font-bold text-gray-800" id="pendingKYC">0</p>
                            </div>
                            <div
                                class="w-10 h-10 md:w-12 md:h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-clock text-yellow-500 text-sm md:text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-green-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs md:text-sm text-gray-500 font-medium">Active Users</p>
                                <p class="text-xl md:text-3xl font-bold text-gray-800" id="activeUsers">0</p>
                            </div>
                            <div
                                class="w-10 h-10 md:w-12 md:h-12 bg-green-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-check-circle text-green-500 text-sm md:text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-purple-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs md:text-sm text-gray-500 font-medium">New (7 Days)</p>
                                <p class="text-xl md:text-3xl font-bold text-gray-800" id="newRegistrations">0</p>
                            </div>
                            <div
                                class="w-10 h-10 md:w-12 md:h-12 bg-purple-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-user-plus text-purple-500 text-sm md:text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Users Table -->
                <div class="bg-white rounded-xl shadow-sm p-4 md:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base md:text-lg font-semibold text-gray-800">Recent Registrations</h2>
                    </div>
                    <div class="table-wrapper -mx-4 md:mx-0">
                        <div class="min-w-[600px] px-4 md:px-0">
                            <table class="w-full">
                                <thead>
                                    <tr class="text-left text-xs text-gray-500 uppercase border-b">
                                        <th class="pb-3 font-semibold">Name</th>
                                        <th class="pb-3 font-semibold hidden md:table-cell">Email</th>
                                        <th class="pb-3 font-semibold hidden sm:table-cell">Phone</th>
                                        <th class="pb-3 font-semibold">Role</th>
                                        <th class="pb-3 font-semibold">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="recentUsersTable">
                                    <tr>
                                        <td colspan="5" class="text-center py-8 text-gray-500">
                                            <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                                            Loading users...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ✅ API & Auth
        // const API_BASE = 'http://localhost:5001/superadmin/api';
        const API_BASE = 'https://app.mysarafa.com/superadmin/api';
        const getBasePath = () => {
            const path = window.location.pathname;
            return path.substring(0, path.lastIndexOf('/') + 1);
        };

        const token = localStorage.getItem('token');
        console.log('🔑 Token:', token ? 'Present' : 'Missing');

        if (!token) {
            console.log('❌ No token found, redirecting to login...');
            window.location.href = getBasePath() + 'login.html';
        }

        // ✅ Load dashboard data
        async function loadDashboard() {
            try {
                console.log('📊 Loading dashboard...');

                const userStr = localStorage.getItem('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    // ✅ Full name from f_name + l_name
                    const fullName = user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'Admin';
                    document.getElementById('adminName').textContent = fullName;
                    document.getElementById('adminInitial').textContent = (fullName || 'A')[0].toUpperCase();
                }

                const response = await fetch(`${API_BASE}/dashboard/stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('📥 Response status:', response.status);

                if (!response.ok) {
                    if (response.status === 401) {
                        console.log('❌ Unauthorized! Redirecting to login...');
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = getBasePath() + 'login.html';
                        alert("401 Unauthorized");
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('📊 Dashboard data:', data);

                if (data.success) {
                    const stats = data.data;
                    document.getElementById('totalUsers').textContent = stats.totalUsers?.total || 0;
                    document.getElementById('pendingKYC').textContent = stats.kycStatus?.pending || 0;
                    document.getElementById('activeUsers').textContent = stats.kycStatus?.active || 0;
                    document.getElementById('newRegistrations').textContent = stats.newRegistrations || 0;
                    renderRecentUsers(stats.recentUsers || []);
                }
            } catch (error) {
                console.error('❌ Dashboard Error:', error);
                document.getElementById('recentUsersTable').innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-red-500">
                            Failed to load data. Check console.
                        </td>
                    </tr>
                `;
            }
        }

        // ✅ Render users with new schema
        function renderRecentUsers(users) {
            const tbody = document.getElementById('recentUsersTable');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">No users yet</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(user => {
                const fullName = user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'N/A';
                const phone = user.mobile_no || user.phone || 'N/A';
                const statusMap = {
                    'verified': 'active',
                    'unverified': 'pending_kyc',
                    'approved': 'active',
                    'pending': 'pending_kyc',
                    'rejected': 'blocked'
                };
                const displayStatus = statusMap[user.user_status] || user.user_status || user.status || 'inactive';

                // ⭐ NAYA role-decide karne ka logic
                const siteRole = user.role?.roleName;
                let displayRole;
                if (siteRole === 'super_admin') {
                    displayRole = 'SUPER ADMIN';   // ⭐ ye sach mein global/unique hai, waisa hi rehne do
                } else if (user.groupMembership?.type === 'admin') {
                    displayRole = 'ADMIN';         // ⭐ ab check ho raha hai: IS GROUP ka owner hai kya
                } else if (user.groupMembership?.groupRoleName) {
                    displayRole = user.groupMembership.groupRoleName.toUpperCase();
                } else {
                    displayRole = 'GROUP MEMBER';
                }

                return `
            <tr class="border-b hover:bg-gray-50 transition">
                <td class="py-3 font-medium">${fullName}</td>
                <td class="py-3 text-sm text-gray-600 hidden md:table-cell">${user.email || 'N/A'}</td>
                <td class="py-3 text-sm text-gray-600 hidden sm:table-cell">${phone}</td>
                <td class="py-3">
                    <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-700">
                        ${displayRole}
                    </span>
                </td>
                <td class="py-3">
                    <span class="px-2 py-1 text-xs rounded-full ${displayStatus === 'active' ? 'bg-green-100 text-green-700' :
                        displayStatus === 'pending_kyc' ? 'bg-yellow-100 text-yellow-700' :
                            'bg-red-100 text-red-700'
                    }">
                        ${displayStatus.replace('_', ' ').toUpperCase()}
                    </span>
                </td>
            </tr>
        `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });
    </script>
    <script src="js/sidebar.js"></script>
</body>

</html>

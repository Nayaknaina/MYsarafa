<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySarafa - Associations (Groups)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/pagination.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .sidebar {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link.active {
            background: rgba(139, 92, 246, 0.3) !important;
            border-left: 3px solid #8b5cf6;
        }

        .logout-btn:hover {
            background: #dc2626 !important;
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 640px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }

        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.5s ease forwards;
        }

        @media (max-width: 640px) {
            .modal-content {
                border-radius: 0;
                max-height: 100vh;
                height: 100vh;
                width: 100vw;
                max-width: 100vw;
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <div class="flex h-screen bg-gray-100">
        <!-- Mobile Hamburger Menu Button -->
        <button onclick="toggleSidebar()"
            class="md:hidden fixed top-4 left-4 z-50 bg-purple-600 text-white p-2 rounded-lg shadow-lg hover:bg-purple-700 transition">
            <i class="fas fa-bars text-xl"></i>
        </button>

        <!-- Sidebar -->
        <div class="sidebar w-64 text-white flex-shrink-0 fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-50"
            id="sidebar">
            <div class="p-6 h-full flex flex-col">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-500 rounded-lg flex items-center justify-center">
                            <span class="font-bold text-lg">M</span>
                        </div>
                        <span class="text-xl font-bold">MySarafa</span>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-white hover:text-gray-300">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <nav class="space-y-1 flex-1">
                    <a href="dashboard.html"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition">
                        <i class="fas fa-th-large w-5"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="members.html"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition">
                        <i class="fas fa-users w-5"></i>
                        <span>Members</span>
                    </a>
                    <a href="kyc.html"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition">
                        <i class="fas fa-id-card w-5"></i>
                        <span>KYC Verification</span>
                    </a>
                    <a href="associations.html"
                        class="nav-link active flex items-center gap-3 px-4 py-3 rounded-lg transition">
                        <i class="fas fa-building w-5"></i>
                        <span>Groups</span>
                    </a>
                    <a href="roles.html"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition">
                        <i class="fas fa-user-tag w-5"></i>
                        <span>Roles</span>
                    </a>
                    <a href="permissions.html"
                        class="flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition">
                        <i class="fas fa-lock w-5"></i>
                        <span>Permissions</span>
                    </a>
                </nav>

                <div class="mt-auto">
                    <button onclick="handleLogout()"
                        class="logout-btn w-full flex items-center gap-3 px-4 py-3 bg-red-600/20 text-red-400 rounded-lg hover:bg-red-600 hover:text-white transition">
                        <i class="fas fa-sign-out-alt w-5"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Overlay for mobile -->
        <div class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" id="sidebarOverlay" onclick="toggleSidebar()">
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto ml-0 md:ml-64">
            <!-- Header -->
            <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">Groups (Associations)</h1>
                    <p class="text-sm text-gray-500 hidden md:block">Manage all groups/associations.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="openAddModal()"
                        class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-3 md:px-4 py-2 rounded-lg hover:from-purple-700 hover:to-indigo-700 transition flex items-center gap-2 text-sm md:text-base">
                        <i class="fas fa-plus"></i>
                        <span class="hidden sm:inline">Add Group</span>
                        <span class="sm:hidden">Add</span>
                    </button>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-600 font-medium hidden sm:block" id="adminName">Loading...</span>
                        <div
                            class="w-10 h-10 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                            <span id="adminInitial">A</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="p-4 md:p-8">
                <!-- Stats -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-6 mb-6 md:mb-8">
                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-blue-500">
                        <p class="text-xs md:text-sm text-gray-500">Total Groups</p>
                        <p class="text-2xl md:text-3xl font-bold text-gray-800" id="totalGroups">0</p>
                    </div>
                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-green-500">
                        <p class="text-xs md:text-sm text-gray-500">Public</p>
                        <p class="text-2xl md:text-3xl font-bold text-gray-800" id="publicGroups">0</p>
                    </div>
                    <div class="stat-card bg-white rounded-xl shadow-sm p-4 md:p-6 border-l-4 border-purple-500">
                        <p class="text-xs md:text-sm text-gray-500">Private</p>
                        <p class="text-2xl md:text-3xl font-bold text-gray-800" id="privateGroups">0</p>
                    </div>
                </div>

                <!-- Groups List -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b">
                        <h2 class="text-base md:text-lg font-semibold text-gray-800">All Groups</h2>
                    </div>
                    <div id="groupsList" class="p-4">
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                            Loading groups...
                        </div>
                    </div>
                    <div id="pagination" class="flex justify-end gap-2 p-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Group Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-auto p-4 md:p-6 max-h-[90vh] overflow-y-auto modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg md:text-xl font-bold text-gray-800">Add New Group</h2>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="addGroupForm" onsubmit="addGroup(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group Name *</label>
                    <input type="text" id="addName" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group Type *</label>
                    <select id="addType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="addDescription" rows="2"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="Group description..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">KYC Required</label>
                    <select id="addKycReq"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-2 rounded-lg hover:from-purple-700 hover:to-indigo-700 transition">
                    Add Group
                </button>
            </form>
        </div>
    </div>

    <!-- Edit Group Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-auto p-4 md:p-6 max-h-[90vh] overflow-y-auto modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg md:text-xl font-bold text-gray-800">Edit Group</h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="editGroupForm" onsubmit="updateGroup(event)">
                <input type="hidden" id="editId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group Name *</label>
                    <input type="text" id="editName" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Group Type *</label>
                    <select id="editType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="editDescription" rows="2"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="Group description..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">KYC Required</label>
                    <select id="editKycReq"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-2 rounded-lg hover:from-blue-700 hover:to-blue-800 transition">
                    Update Group
                </button>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isMobile = window.innerWidth < 768;
            if (isMobile && sidebar && !sidebar.classList.contains('-translate-x-full')) {
                if (!sidebar.contains(event.target) && !event.target.closest('button')) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        });

        window.addEventListener('resize', function () {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });

        // const API_BASE = 'http://localhost:5001/superadmin/api';
         const API_BASE = 'https://app.mysarafa.com/superadmin/api';
        let currentPage = 1;
        const limit = 10;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        const getBasePath = () => {
            const path = window.location.pathname;
            return path.substring(0, path.lastIndexOf('/') + 1);
        };

        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            const fullName = user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'Admin';
            document.getElementById('adminName').textContent = fullName;
            document.getElementById('adminInitial').textContent = (fullName || 'A')[0].toUpperCase();
        }

        // ✅ Load groups
        async function loadGroups(page = 1) {

            currentPage = page;

            try {

                const response = await fetch(
                    `${API_BASE}/associations?page=${page}&limit=${limit}`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (data.success) {

                    renderGroups(data.associations);

                    updateStats(data.associations);

                    renderPagination(
                        "pagination",
                        data.pagination.page,
                        data.pagination.totalPages,
                        loadGroups
                    );

                }

            } catch (error) {

                console.log(error);

            }

        }

        function renderGroups(groups) {
            const container = document.getElementById('groupsList');
            if (!groups || groups.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-building text-4xl mb-3 block text-gray-300"></i>
                        <p class="text-lg font-semibold">No groups yet</p>
                        <p class="text-sm">Click "Add Group" to create one.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = groups.map(group => `
                <div class="bg-white border border-gray-200 rounded-lg p-4 mb-3 hover:shadow-md transition">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 font-bold text-lg">
                                ${(group.name || 'G')[0].toUpperCase()}
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800">${group.name || 'N/A'}</p>
                                <p class="text-sm text-gray-500">
                                    Type: ${group.g_type || group.type || 'public'} • 
                                    Members: ${group.total_mem || group.memberCount || 0}
                                    <span class="ml-2 text-xs bg-gray-100 px-2 py-1 rounded-full">
                                        ${group.is_kyc_req ? 'KYC Required' : 'KYC Not Required'}
                                    </span>
                                </p>
                                ${group.user ? `<p class="text-xs text-blue-600">Created by: ${group.user.f_name || ''} ${group.user.l_name || ''}</p>` : ''}
                                ${group.description ? `<p class="text-xs text-gray-500 mt-1">${group.description}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="px-2 py-1 text-xs rounded-full ${group.g_type === 'public' || group.type === 'public' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'}">
                                ${(group.g_type || group.type || 'public').toUpperCase()}
                            </span>
                            <button onclick="openEditModal('${group._id}')" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteGroup('${group._id}')" class="text-red-600 hover:text-red-800">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(groups) {
            const total = groups.length;
            const publicGroups = groups.filter(g => g.g_type === 'public' || g.type === 'public').length;
            const privateGroups = groups.filter(g => g.g_type === 'private' || g.type === 'private').length;
            document.getElementById('totalGroups').textContent = total;
            document.getElementById('publicGroups').textContent = publicGroups;
            document.getElementById('privateGroups').textContent = privateGroups;
        }

        // ✅ Add group
        async function addGroup(event) {
            event.preventDefault();
            const data = {
                name: document.getElementById('addName').value,
                g_type: document.getElementById('addType').value,
                description: document.getElementById('addDescription').value,
                is_kyc_req: document.getElementById('addKycReq').value === 'true'
            };

            try {
                const response = await fetch(`${API_BASE}/associations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Group added successfully!');
                    closeAddModal();
                    loadGroups();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ Error adding group');
            }
        }

        // ✅ Open edit modal
        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE}/associations/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    const group = data.association;
                    document.getElementById('editId').value = group._id;
                    document.getElementById('editName').value = group.name || '';
                    document.getElementById('editType').value = group.g_type || group.type || 'public';
                    document.getElementById('editDescription').value = group.description || '';
                    document.getElementById('editKycReq').value = group.is_kyc_req ? 'true' : 'false';
                    document.getElementById('editModal').classList.remove('hidden');
                }
            } catch (error) {
                alert('❌ Error loading group data');
            }
        }

        // ✅ Update group
        async function updateGroup(event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('editName').value,
                g_type: document.getElementById('editType').value,
                description: document.getElementById('editDescription').value,
                is_kyc_req: document.getElementById('editKycReq').value === 'true'
            };

            try {
                const response = await fetch(`${API_BASE}/associations/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Group updated successfully!');
                    closeEditModal();
                    loadGroups();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ Error updating group');
            }
        }

        // ✅ Delete group
        async function deleteGroup(id) {
            if (!confirm('Are you sure you want to delete this group?')) return;
            try {
                const response = await fetch(`${API_BASE}/associations/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ Group deleted successfully!');
                    loadGroups();
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('❌ Error deleting group');
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addGroupForm').reset();
        }
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = getBasePath() + 'login.html';
        }

        document.addEventListener('DOMContentLoaded', loadGroups);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySarafa - Permissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="icon" href="/assets/favicon/favicon_logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/favicon/favicon_logo.png">
    <style>
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .matrix th,
        .matrix td {
            text-align: center;
            padding: 12px 16px;
            white-space: nowrap;
        }

        .matrix th:first-child,
        .matrix td:first-child {
            text-align: left;
        }

        .matrix input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #8b5cf6;
            cursor: pointer;
        }

        .system-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 9999px;
            background: #ede9fe;
            color: #6d28d9;
            font-weight: 600;
            margin-left: 6px;
        }
    </style>
</head>

<body>
    <!-- Common Sidebar -->
    <div id="sidebar-container"></div>
    <button id="sidebarToggle" onclick="toggleSidebar()"
        class="lg:hidden fixed top-4 left-4 z-[60] bg-purple-600 text-white p-2.5 rounded-lg shadow-lg">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <div class="flex h-screen bg-gray-100">

        <!-- Main Content -->
        <div class="flex-1 overflow-auto ml-0 lg:ml-64">
            <!-- Header -->
            <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">Permissions</h1>
                    <p class="text-sm text-gray-500 hidden md:block">Decide what each role can access. Check a box to
                        grant it, uncheck to remove it — saves instantly.</p>
                </div>
                <div class="flex items-center gap-4">
                    <select id="groupSelector" onchange="onGroupSelectorChange(this.value)"
                        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </select>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-600 font-medium hidden sm:block" id="adminName">Loading...</span>
                        <div
                            class="w-10 h-10 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                            <span id="adminInitial">A</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="p-4 md:p-8">
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <div>
                            <h2 class="text-base md:text-lg font-semibold text-gray-800">Role Permission Matrix</h2>
                            <p class="text-xs text-gray-500">Roles created on the Roles page (default + custom) show up
                                here automatically.</p>
                        </div>
                        <a href="roles.html" class="text-sm text-purple-600 hover:underline whitespace-nowrap">
                            <i class="fas fa-plus mr-1"></i>Create new role
                        </a>
                    </div>
                    <div class="table-wrapper">
                        <div class="min-w-[700px]">
                            <table class="w-full matrix" id="matrixTable">
                                <thead>
                                    <tr class="bg-gray-50 text-left text-xs text-gray-500 uppercase border-b"
                                        id="matrixHead"></tr>
                                </thead>
                                <tbody id="matrixBody">
                                    <tr>
                                        <td colspan="8" class="text-center py-8 text-gray-500">
                                            <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
                                            Loading roles...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        // const ROLE_API = "http://localhost:5001/Groups/${currentGroupId}/roles";

        function getRoleApi() {
            // return `http://localhost:5001/Groups/${currentGroupId}/roles`;
            return `https://app.mysarafa.com/Groups/${currentGroupId}/roles`;
        }

        if (!token) {
            window.location.href = 'login.html';
        }

        // Load admin info (same as roles.html)
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            const fullName = user.f_name && user.l_name ? `${user.f_name} ${user.l_name}` : user.fullName || 'Admin';
            document.getElementById('adminName').textContent = fullName;
            document.getElementById('adminInitial').textContent = (fullName || 'A')[0].toUpperCase();
        }

        let allPermissions = [];
        let allRoles = [];

        function permLabel(p) {
            return p.replace('manage_', '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        async function api(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });
            return res.json();
        }

        async function loadPermissions() {
            const data = await api(`${getRoleApi()}/permissions`);
            if (data.success) {
                allPermissions = data.permissions;
                renderHead();
            }
        }

        function renderHead() {
            const head = document.getElementById('matrixHead');
            head.innerHTML = `<th class="px-4 py-3 font-semibold">Role</th>` +
                allPermissions.map(p => `<th class="px-4 py-3 font-semibold">${permLabel(p)}</th>`).join('');
        }


        function renderBody() {
            const tbody = document.getElementById('matrixBody');

            if (!allRoles.length) {
                tbody.innerHTML = `<tr><td colspan="${allPermissions.length + 1}" class="text-center py-8 text-gray-500">
            No roles yet. <a href="roles.html" class="text-purple-600 hover:underline">Create one</a> first.
        </td></tr>`;
                return;
            }

            tbody.innerHTML = allRoles.map(role => {
                const isDefault = !role.group;
                const isAdminRole = role.roleName === 'admin';   // ⭐ admin row special treat hogi
                return `
        <tr class="border-b hover:bg-gray-50 transition">
            <td class="px-4 py-3 font-medium">
                ${role.roleName}
                ${isDefault ? '<span class="system-tag">Default</span>' : ''}
                ${isAdminRole ? '<span class="system-tag">Full Access</span>' : ''}
            </td>
            ${allPermissions.map(p => `
                <td class="px-4 py-3">
                    <input type="checkbox"
                        ${isAdminRole ? 'checked disabled' : ((role.permissions || []).includes(p) ? 'checked' : '')}
                        ${isAdminRole ? '' : `onchange="togglePermission('${role._id}', '${p}', this.checked, this)"`}>
                </td>
            `).join('')}
        </tr>
    `;
            }).join('');
        }

        async function togglePermission(roleId, permission, isChecked, checkboxEl) {
            checkboxEl.disabled = true;
            const role = allRoles.find(r => r._id === roleId);
            const currentPerms = role?.permissions || [];
            const updated = isChecked
                ? [...currentPerms, permission]
                : currentPerms.filter(p => p !== permission);

            const data = await api(`${getRoleApi()}/${roleId}`, {
                method: 'PUT',
                body: JSON.stringify({ permissions: updated })
            });

            // ⭐ Default role edit karne se naya group-specific role ban sakta hai (naya _id),
            // isliye poori list reload karo taaki UI sahi state dikhaye
            await loadRoles();
        }

        async function loadRoles() {
            const data = await api(getRoleApi());
            if (data.success) {
                const roles = data.roles || [];

                // ⭐ "admin" hamesha sabse top — baaki roles createdAt ke hisaab se (purane pehle)
                const adminRole = roles.find(r => r.roleName === 'admin');
                const otherRoles = roles
                    .filter(r => r.roleName !== 'admin')
                    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

                allRoles = adminRole ? [adminRole, ...otherRoles] : otherRoles;
                renderBody();
            }
        }

        let currentGroupId = null;

        async function initGroupContext() {
            // const res = await fetch('http://localhost:5001/Groups/my-groups-data', {
            const res = await fetch('https://app.mysarafa.com/Groups/my-groups-data', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            const ownedGroups = data.groups?.filter(g => g.isOwner) || [];

            if (!ownedGroups.length) {
                document.getElementById('matrixBody').innerHTML =
                    `<tr><td colspan="8" class="text-center py-8 text-gray-500">Aapka koi group nahi hai</td></tr>`;
                return null;
            }

            renderGroupSelector(ownedGroups);

            // Pehli baar load hone par: saved group use karo, warna pehla group
            const savedGroupId = localStorage.getItem('lastSelectedGroupId');
            const validSaved = ownedGroups.find(g => (g._id || g.id) === savedGroupId);
            currentGroupId = validSaved ? savedGroupId : (ownedGroups[0]._id || ownedGroups[0].id);

            const selector = document.getElementById('groupSelector');
            if (selector) selector.value = currentGroupId;

            return currentGroupId;
        }

        // function
        function renderGroupSelector(groups) {
            const selector = document.getElementById('groupSelector');
            if (!selector) return;
            selector.innerHTML = groups.map(g =>
                `<option value="${g._id || g.id}">${g.g_name || g.name}</option>`
            ).join('');
        }

        function onGroupSelectorChange(selectedGroupId) {
            currentGroupId = selectedGroupId;
            localStorage.setItem('lastSelectedGroupId', selectedGroupId);
            loadPermissions();
            loadRoles();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await initGroupContext();
            if (!currentGroupId) return;
            await loadPermissions();
            await loadRoles();
        });
    </script>
    <script src="js/sidebar.js"></script>
</body>

</html>

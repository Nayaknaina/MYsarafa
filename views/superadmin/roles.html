<!DOCTYPE html>

<head>

    <script src="js/pagination.js"></script>

    <style>
        .sidebar {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link.active {
            background: rgba(139, 92, 246, 0.3) !important;
            border-left: 3px solid #8b5cf6;
        }

        .logout-btn:hover {
            background: #dc2626 !important;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }

        .role-super_admin {
            background: #ef4444;
            color: white;
        }

        .role-user {
            background: #6b7280;
            color: white;
        }

        .role-admin {
            background: #2563eb;
            color: #fff;
        }

        .role-manager {
            background: #f59e0b;
            color: #fff;
        }

        .role-worker {
            background: #10b981;
            color: #fff;
        }

        .role-member {
            background: #8b5cf6;
            color: #fff;
        }

        .role-user {
            background: #6b7280;
            color: #fff;
        }

        .role-super_admin {
            background: #ef4444;
            color: #fff;
        }

        @media (max-width: 640px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }

        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

</head>

        async function initGroupContext() {
            try {
                const res = await fetch('http://localhost:5001/Groups/my-groups-data', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();

                const ownedGroups = data.groups?.filter(g => g.isOwner || g.role === 'admin') || [];

                if (!ownedGroups.length) {
                    document.getElementById('rolesTableBody').innerHTML =
                        `<tr><td colspan="6" class="text-center py-8 text-gray-500">Aapka koi group nahi hai</td></tr>`;
                    return null;
                }

                // Dropdown populate karo
                const selector = document.getElementById('groupSelector');
                selector.innerHTML = ownedGroups.map(g =>
                    `<option value="${g._id || g.id}">${g.g_name || g.name}</option>`
                ).join('');

                // Pehli baar: localStorage me saved group use karo, warna pehla group
                const savedGroupId = localStorage.getItem('lastSelectedGroupId');
                const validSaved = ownedGroups.find(g => (g._id || g.id) === savedGroupId);
                currentGroupId = validSaved ? savedGroupId : (ownedGroups[0]._id || ownedGroups[0].id);
                selector.value = currentGroupId;

                return currentGroupId;
            } catch (err) {
                console.error('❌ initGroupContext error:', err);
                return null;
            }
        }

            currentGroupId = groupId;
            localStorage.setItem('lastSelectedGroupId', groupId);
            await loadRoles();

        }

            if (!currentGroupId) await initGroupContext();
            if (!currentGroupId) return;

            const res = await fetch(`http://localhost:5001/Groups/${currentGroupId}/roles/members`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                // ⭐ Group naam header mein dikhao
                const groupNameEl = document.getElementById('currentGroupName');
                if (groupNameEl && data.group) groupNameEl.textContent = data.group.g_name;

                const formatted = data.members.map(m => ({
                    ...formatUserForDisplay(m),
                    groupName: data.group?.g_name || ''
                }));
                renderUsers(formatted);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('rolesTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">No users found</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map((user, index) => {
                const roleName = user.role?.roleName || (user.type === 'admin' ? 'Admin (You)' : 'No Role');
                const isProtected = user.type === 'admin';
                const badgeClass = roleName.toLowerCase().replace(/[^a-z0-9]+/g, '_');

                return `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="px-3 md:px-6 py-2 md:py-3 text-sm">${(currentPage - 1) * limit + index + 1}</td>
                    <td class="px-3 md:px-6 py-2 md:py-3 font-medium">${user.fullName}</td>
                    <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600 hidden md:table-cell">${user.email}</td>
                    <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600">${user.groupName}</td>
                    <td class="px-3 md:px-6 py-2 md:py-3 text-sm text-gray-600 hidden sm:table-cell">${user.phone}</td>
                    <td class="px-3 md:px-6 py-2 md:py-3">
                        <span class="role-badge role-${badgeClass}">${roleName.toUpperCase()}</span>
                    </td>
                    <td class="px-3 md:px-6 py-2 md:py-3">
                        ${isProtected ? `
                            <span class="text-xs text-gray-400">Protected (You)</span>
                        ` : `
<select onchange="updateRole('${user._id}', this.value)" class="px-2 md:px-3 py-1 border border-gray-300 rounded-lg text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
     <option value="">-- None --</option>
   ${(allRoles || [])
                        .filter(role => role.roleName !== 'admin')   // ⭐ admin role kisi aur ko assign nahi hone dena
                        .map(role => `
    <option value="${role._id}" ${user.role?._id === role._id ? "selected" : ""}>
        ${role.roleName}
    </option>
`).join("")}
</select>
                        `}
                    </td>
                </tr>
            `;
            }).join('');
        }

        async function updateRole(userId, roleId) {
            if (!confirm("Change this user's role?")) {
                loadUsers();
                return;
            }
            try {
                const res = await fetch(`http://localhost:5001/Groups/${currentGroupId}/roles/assign`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ memberId: userId, roleId })
                });
                const data = await res.json();

                if (data.success) {
                    alert("Role Updated Successfully");
                    await loadRoles();
                    await loadUsers();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.log(err);
                alert("Something went wrong.");
            }
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = getBasePath() + 'login.html';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await initGroupContext();
            if (!currentGroupId) return;
            await loadRoles();
            await loadUsers();
        });

        function openRoleModal() {
            document.getElementById("roleModal").classList.remove("hidden");
            document.getElementById("roleModal").classList.add("flex");
        }

        function closeRoleModal() {
            document.getElementById("roleModal").classList.remove("flex");
            document.getElementById("roleModal").classList.add("hidden");
            document.getElementById("roleName").value = "";
            document.getElementById("roleDescription").value = "";
        }

        async function loadRoles() {
            try {
                const response = await fetch(getRoleApi(), {
                    headers: { Authorization: `Bearer ${token}` }
                });
                // const response = await fetch('/Groups/groups?permission=manage_announcements', {   // ⭐ query param add kiya
                //     method: 'GET',
                //     headers: { 'Content-Type': 'application/json' },
                //     credentials: 'include'
                // });
                const data = await response.json();
                if (data.success) {
                    allRoles = data.roles || [];   // ✅ fix: "roles" key use karo, "data" nahi
                }
            } catch (err) {
                console.log(err);
            }
        }

        async function createRole() {
            const name = document.getElementById("roleName").value.trim();
            const description = document.getElementById("roleDescription").value.trim();
            if (!name) return alert("Role name is required");

            try {
                const response = await fetch(getRoleApi(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ roleName: name, description, permissions: [] })
                });
                const data = await response.json();
                if (data.success) {
                    alert("Role Created Successfully");
                    closeRoleModal();
                    await loadRoles();
                    await loadUsers();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.log(err);
            }
        }
    </script>

</body>

</html>

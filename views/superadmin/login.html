<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySarafa - Super Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 420px;
        }

        .already-logged-in {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1e40af;
        }

        /* ✅ Mobile Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem !important;
                margin: 1rem !important;
                border-radius: 1rem !important;
            }

            .login-card h1 {
                font-size: 1.5rem !important;
            }

            .login-card .w-20 {
                width: 4rem !important;
                height: 4rem !important;
            }

            .login-card .w-20 span {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>

<body class="gradient-bg flex items-center justify-center p-4">
    <div class="login-card p-6 md:p-8 rounded-2xl shadow-2xl mx-auto">
        <!-- Logo -->
        <div class="text-center mb-6 md:mb-8">
            <div
                class="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                <span class="text-white text-2xl md:text-3xl font-bold">M</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">MySarafa Admin</h1>
            <p class="text-gray-500 text-xs md:text-sm mt-1">Super Admin Panel</p>
        </div>

        <!-- Already Logged In Message -->
        <div id="alreadyLoggedIn" class="already-logged-in p-3 md:p-4 rounded-lg mb-4 hidden">
            <p class="font-semibold text-sm md:text-base">✅ You are already logged in!</p>
            <p class="text-xs md:text-sm mt-1">Go to <a href="dashboard.html"
                    class="text-blue-600 underline font-semibold">Dashboard</a> or logout below.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-xs md:text-sm font-semibold mb-2">Email Address</label>
                <input type="email" id="email"
                    class="w-full px-4 py-2.5 md:py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition text-sm md:text-base"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-xs md:text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password"
                    class="w-full px-4 py-2.5 md:py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition text-sm md:text-base"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-2.5 md:py-3 rounded-lg hover:from-purple-700 hover:to-indigo-700 transition duration-300 transform hover:scale-[1.02] text-sm md:text-base">
                Sign In
            </button>
        </form>

        <!-- Error Message -->
        <div id="errorMsg" class="mt-4 hidden">
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span id="errorText" class="block sm:inline text-sm">Invalid credentials</span>
            </div>
        </div>

        <!-- Logout Button (shows when already logged in) -->
        <div id="logoutSection" class="mt-4 hidden">
            <button onclick="handleLogout()"
                class="w-full bg-red-600 text-white font-bold py-2.5 md:py-3 rounded-lg hover:bg-red-700 transition duration-300 text-sm md:text-base">
                🚪 Logout & Switch Account
            </button>
        </div>

        <!-- <div class="mt-6 text-center text-xs md:text-sm text-gray-500">
            <p>Demo: admin@mysarafa.com / Admin@123</p>
        </div> -->
    </div>

    <script>
        // const API_BASE = "http://localhost:5001/superadmin/api"; 
        const API_BASE = "https://app.mysarafa.com/superadmin/api";

        // ✅ Get base path dynamically
        const getBasePath = () => {
            const path = window.location.pathname;
            return path.substring(0, path.lastIndexOf('/') + 1);
        };

        // ✅ Check if already logged in - Show message instead of auto-redirect
        (function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('alreadyLoggedIn').classList.remove('hidden');
                document.getElementById('logoutSection').classList.remove('hidden');
                document.getElementById('loginForm').style.opacity = '0.6';
                document.getElementById('loginForm').style.pointerEvents = 'none';
            }
        })();

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                console.log('🔍 Sending login request to:', `${API_BASE}/auth/login`);

                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('📥 Response:', data);

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = getBasePath() + 'dashboard.html';
                } else {
                    errorText.textContent = data.message || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error('❌ Network Error:', error);
                errorText.textContent = 'Network error. Please check if backend is running on port 5000';
                errorMsg.classList.remove('hidden');
            } finally {
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        }

        // ✅ Logout function
        function handleLogout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>

</html>
